  <!-- PANTALLA 5 — CONTACTO -->
  <section id="contact" class="screen contact">
    <div class="content">
      <h2 data-i18n="contact.title"></h2>
      <p class="subtitle" data-i18n="contact.subtitle"></p>

      <form
        class="form"
        name="contact"
        method="post"
        data-netlify="true"
        netlify-honeypot="bot-field"
        action="/?lead=ok#contact"
        aria-label="Contact form"
      >
        <input type="hidden" name="form-name" value="contact" />
        <div style="position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden;" aria-hidden="true">
          <input type="text" name="bot-field" tabindex="-1" autocomplete="off" />
        </div>

        <p id="contact-status" class="muted small" role="status" aria-live="polite" hidden data-i18n="contact.statusSent"></p>

        <label for="contact-name" class="visually-hidden" data-i18n="contact.name"></label>
        <input
          id="contact-name"
          type="text"
          name="name"
          placeholder=""
          required
          autocomplete="name"
          data-i18n-ph="contact.name"
        />

        <label for="contact-email" class="visually-hidden" data-i18n="contact.email"></label>
        <input
          id="contact-email"
          type="email"
          name="email"
          placeholder=""
          required
          autocomplete="email"
          data-i18n-ph="contact.email"
        />

        <label for="contact-phone" class="visually-hidden" data-i18n="contact.phone"></label>
        <input
          id="contact-phone"
          type="tel"
          name="phone"
          placeholder=""
          required
          autocomplete="tel"
          data-i18n-ph="contact.phone"
        />

        <label for="contact-message" class="visually-hidden" data-i18n="contact.msg"></label>
        <textarea
          id="contact-message"
          name="message"
          rows="3"
          placeholder=""
          data-i18n-ph="contact.msg"
        ></textarea>

        <button type="submit" class="cta" data-i18n="contact.submit"></button>
      </form>

      <p class="muted small" data-i18n="contact.footer"></p>
    </div>
  </section>

  <script>
    (function () {
      try {
        var params = new URLSearchParams(window.location.search || "");
        if (params.get("lead") === "ok") {
          var el = document.getElementById("contact-status");
          if (el) el.hidden = false;

          params.delete("lead");
          var cleanQuery = params.toString();
          var cleanUrl = window.location.pathname + (cleanQuery ? ("?" + cleanQuery) : "") + window.location.hash;
          window.history.replaceState({}, "", cleanUrl);
        }
      } catch (e) {
        // no-op
      }
    })();

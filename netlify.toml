[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = [
    "assets/js/data/events-special-venues.json",
    "assets/js/data/events-special-catalog.json",
    "assets/js/data/events-special-pricing.json",
    "assets/js/data/direct-transfer-coverage.geojson",
    "assets/js/data/airport-zone-catalog.js",
    "assets/js/data/airport-extended-rings-catalog.js",
    "assets/js/data/airport-extended-corridors-catalog.js"
  ]

[[redirects]]
  from = "https://partners.pixkuy.com"
  to = "/.netlify/functions/qr-redirect?code=partners"
  status = 200
  force = true

[[redirects]]
  from = "https://partners.pixkuy.com/"
  to = "/.netlify/functions/qr-redirect?code=partners"
  status = 200
  force = true

[[redirects]]
  from = "https://partners.pixkuy.com/*"
  to = "/.netlify/functions/qr-redirect?code=partners"
  status = 200
  force = true

[[redirects]]
  from = "/qr/partners"
  to = "/.netlify/functions/qr-redirect?code=partners"
  status = 200
  force = true

[[redirects]]
  from = "/qr/:code"
  to = "/.netlify/functions/qr-redirect?code=:code"
  status = 200
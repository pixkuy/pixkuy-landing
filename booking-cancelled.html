<!DOCTYPE html>
<html lang="es" data-booking-status-i18n="pending">
<head>
  <meta charset="utf-8">
  <title>Pago no completado — Pixkuy Mobility</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0f1113">
  <meta name="color-scheme" content="dark light">

  <link rel="stylesheet" href="assets/css/00-tokens.css">
  <link rel="stylesheet" href="assets/css/10-base.css">
  <link rel="stylesheet" href="assets/css/20-components.css">
  <link rel="stylesheet" href="assets/css/30-sections.css">
  <link rel="stylesheet" href="assets/css/81-booking-status-page.css">
<link rel="stylesheet" href="assets/css/82-booking-status-mobile.css">
<link rel="stylesheet" href="assets/css/50-mobile-topbar.css">
<link rel="stylesheet" href="assets/css/90-a11y.css">
</head>

<body class="booking-status-shell">
  <div class="mobile-topbar" data-mobile-topbar>
    <div class="mobile-topbar__brand">
      <img
        src="assets/img/pixkuy-logo_only words-white.webp"
        alt="Pixkuy Mobility"
        width="224"
        height="64"
        loading="eager"
        decoding="async"
      >
    </div>
  </div>
    <nav class="lang" aria-label="Language selector">
    <button
      class="lang-trigger"
      id="lang-trigger"
      type="button"
      aria-haspopup="menu"
      aria-expanded="false"
    >
      <span class="lang-current" aria-hidden="true"></span>
      <span class="visually-hidden" data-i18n="ui.language"></span>
    </button>

    <ul
      class="lang-menu"
      role="menu"
      aria-labelledby="lang-trigger"
      hidden
    ></ul>
  </nav>
  <main class="booking-status-page" data-booking-status-page="cancelled">
    <section
      class="booking-status booking-status--desktop"
      aria-labelledby="booking-cancelled-title"
      data-booking-cancelled-desktop
    >
      <div class="booking-status__brand">
        <img
          class="booking-status__logo"
          src="assets/img/pixkuy-logo-white.webp"
          alt="Pixkuy Mobility"
          width="154"
          height="45"
          loading="eager"
          decoding="async"
        >
      </div>

      <div class="booking-status__content">
        <p
          class="booking-status__state"
          data-booking-status-state
        ></p>

        <h1
          id="booking-cancelled-title"
          class="booking-status__title"
          data-booking-status-title
        ></h1>

        <p
          class="booking-status__lead"
          data-booking-status-lead
        ></p>

        <dl
          class="booking-status__details"
          data-booking-status-details
          hidden
        >
          <div class="booking-status__detail">
            <dt data-booking-status-label="publicCode"></dt>
            <dd data-booking-status-public-code></dd>
          </div>

          <div class="booking-status__detail">
            <dt data-booking-status-label="payment"></dt>
            <dd data-booking-status-payment></dd>
          </div>

          <div class="booking-status__detail">
            <dt data-booking-status-label="date"></dt>
            <dd data-booking-status-date></dd>
          </div>

          <div class="booking-status__detail">
            <dt data-booking-status-label="time"></dt>
            <dd data-booking-status-time></dd>
          </div>
        </dl>

        <div
          class="booking-status__notice"
          data-booking-status-notice
          hidden
        ></div>

        <div class="booking-status__actions">
          <button
            type="button"
            class="cta booking-status__primary"
            data-booking-cancelled-retry
            hidden
          ></button>

          <a
            class="cta booking-status__primary"
            href="/?service=hourly_daily#services"
            data-booking-cancelled-new
            hidden
          ></a>

          <a
            class="booking-status__secondary"
            href="https://wa.me/5215528837400"
            target="_blank"
            rel="noopener noreferrer"
            data-booking-status-whatsapp
          ></a>
        </div>
      </div>
    </section>

    <section
      class="booking-status-mobile"
      aria-labelledby="booking-cancelled-mobile-title"
      aria-hidden="true"
      hidden
      data-booking-cancelled-mobile
    >
      <div
        class="booking-status-mobile__backdrop"
        aria-hidden="true"
        data-booking-status-mobile-close
      ></div>

      <div
        class="booking-status-mobile__panel"
        role="document"
        tabindex="-1"
        data-booking-cancelled-mobile-panel
      >
        <button
          type="button"
          class="booking-status-mobile__close"
          data-booking-status-mobile-close
        >
          <span aria-hidden="true">×</span>
        </button>

        <div class="booking-status-mobile__brand">
          <img
            class="booking-status-mobile__logo"
            src="assets/img/pixkuy-logo-white.webp"
            alt="Pixkuy Mobility"
            width="96"
            height="28"
            loading="eager"
            decoding="async"
          >
        </div>

        <p
          class="booking-status-mobile__state"
          data-booking-status-state
        ></p>

        <h1
          id="booking-cancelled-mobile-title"
          class="booking-status-mobile__title"
          data-booking-status-title
        ></h1>

        <p
          class="booking-status-mobile__lead"
          data-booking-status-lead
        ></p>

        <dl
          class="booking-status-mobile__details"
          data-booking-status-details
          hidden
        >
          <div class="booking-status-mobile__detail">
            <dt data-booking-status-label="publicCode"></dt>
            <dd data-booking-status-public-code></dd>
          </div>

          <div class="booking-status-mobile__detail">
            <dt data-booking-status-label="payment"></dt>
            <dd data-booking-status-payment></dd>
          </div>

          <div class="booking-status-mobile__detail">
            <dt data-booking-status-label="date"></dt>
            <dd data-booking-status-date></dd>
          </div>

          <div class="booking-status-mobile__detail">
            <dt data-booking-status-label="time"></dt>
            <dd data-booking-status-time></dd>
          </div>
        </dl>

        <div
          class="booking-status-mobile__notice"
          data-booking-status-notice
          hidden
        ></div>

        <div class="booking-status-mobile__actions">
          <button
            type="button"
            class="booking-status-mobile__primary"
            data-booking-cancelled-retry
            hidden
          ></button>

          <a
            class="booking-status-mobile__primary"
            href="/?service=hourly_daily#services"
            data-booking-cancelled-new
            hidden
          ></a>

          <a
            class="booking-status-mobile__secondary"
            href="https://wa.me/5215528837400"
            target="_blank"
            rel="noopener noreferrer"
            data-booking-status-whatsapp
          ></a>
        </div>
      </div>
    </section>
  </main>
  
  <script src="assets/js/i18n/fallback.es.js"></script>
<script src="assets/js/i18n/catalog.js"></script>
<script src="assets/js/i18n/loader.js"></script>
<script src="assets/js/i18n/dom.js"></script>
<script src="assets/js/i18n/selector.js"></script>
<script src="assets/js/i18n.js"></script>

  <script>
    window.PIXKUY_BOOKING_STATUS_CONFIG = {
      apiBaseUrl:
        window.location.hostname === "192.168.0.14"
          ? "http://192.168.0.14:3002"
          : (
              window.location.hostname === "localhost" ||
              window.location.hostname === "127.0.0.1"
                ? "http://localhost:3002"
                : ""
            ),
      publicSiteKey: "local_pixkuy_site_key"
    };
  </script>
  <script src="assets/js/forms/booking-status-state.js"></script>
  <script src="assets/js/forms/booking-cancelled-retry.js"></script>
  <script src="assets/js/forms/booking-cancelled-desktop.js"></script>
  <script src="assets/js/forms/booking-cancelled-mobile.js"></script>
</body>
</html>
